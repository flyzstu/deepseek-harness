# 定时从 upstream 拉取最新提交,把 fork-only 的 commits rebase 到上游最新,
# 然后 force-push 到 fork master。失败通知依赖 GitHub 内置邮件。
#
# 触发:
#   - schedule: 每天 UTC 02:00 (北京时间 10:00)
#   - workflow_dispatch: 手动立即同步
#
# 行为契约:
#   - upstream 没有新提交 -> no-op 退出
#   - 推送成功 -> workflow 成功 -> 触发 build-dsh-web-image
#   - rebase 冲突 / push 失败 -> workflow 失败 -> GitHub 自动发邮件给触发者
#
# 跳过 PR 流程的原因:这个 fork 上 GraphQL 的所有 pullRequest mutation 都
# 报 "Pull requests are disabled for this repository",而 REST PUT
# /pulls/{n}/merge 对 fine-grained PAT 又返回 403,只有 fork owner 的 OAuth
# 能 merge PR。直接 push master 更简单可靠。

name: Sync upstream (deepseek-ai/deepseek-harness)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-upstream
  cancel-in-progress: true

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  sync:
    name: Sync upstream to fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "flyzstu"
          git config user.email "flyzstu@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master

      - name: Detect upstream changes
        id: detect
        run: |
          ahead=$(git rev-list --count origin/master..upstream/master)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$(git rev-parse upstream/master)" >> "$GITHUB_OUTPUT"

      - name: No-op when already in sync
        if: steps.detect.outputs.ahead == '0'
        run: |
          echo "origin/master already at upstream/master. Nothing to do."

      - name: Rebase fork-only commits onto upstream
        if: steps.detect.outputs.ahead != '0'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout master
          if ! git rebase -X patience -X renormalize upstream/master; then
            echo "::error::Rebase produced conflicts. Resolve manually:"
            echo "::error::  git remote set-url origin https://github.com/${GITHUB_REPOSITORY}.git"
            echo "::error::  git rebase --abort"
            echo "::error::  git rebase -X patience -X renormalize upstream/master"
            echo "::error::  git push --force-with-lease origin master"
            git rebase --abort || true
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            exit 1
          fi

      - name: Force-push rebased master
        if: steps.detect.outputs.ahead != '0' && success()
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin master
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "Pushed $(git rev-parse HEAD) to origin/master"
