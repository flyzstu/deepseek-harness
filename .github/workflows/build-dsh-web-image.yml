# 当 sync-upstream.yml 成功 merge 到 origin/master 后,构建并推送 dsh-web 镜像。
# 失败通知依赖 GitHub 内置邮件 (workflow 失败会发到触发者);成功时不发任何东西。
#
# 推送目标: ghcr.io/<owner>/deepseek-harness/dsh-web
#   - latest  -> 每次成功都更新
#   - <date>-<short-sha> -> 不可变的历史标签
#
# 触发:
#   - workflow_run (sync-upstream 完成后,只在 master 上)
#   - workflow_dispatch (手动,可选 ref)

name: Build dsh-web image

on:
  workflow_run:
    workflows: ["Sync upstream (deepseek-ai/deepseek-harness)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: master head)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dsh-web-image
  cancel-in-progress: true

jobs:
  build:
    # sync workflow force-pushes master on both schedule (push-like event)
    # and workflow_dispatch (synthetic event). Build when the sync concluded
    # successfully on master; workflow_run.event and head_branch sanity-check
    # guard against future forks in the triggering workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input_ref="${{ inputs.ref }}"
            [ -z "$input_ref" ] && input_ref="master"
          else
            input_ref="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "ref=$input_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU and Buildx
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(git rev-parse --short HEAD)
          date_tag=$(date -u +%Y%m%d)
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness/dsh-web:latest
            ghcr.io/${{ github.repository_owner }}/deepseek-harness/dsh-web:${{ steps.meta.outputs.date_tag }}-${{ steps.meta.outputs.short_sha }}
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.meta.outputs.short_sha }}
          # 不使用 cache:examples/ 里的符号链接让 BuildKit 算 checksum
          # 时报 "/examples: not found",任何 cache-from 都会触发。
          # Dockerfile 已按依赖顺序 COPY 拆层,增量构建影响有限。
